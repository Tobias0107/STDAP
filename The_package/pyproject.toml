[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "STDAP"
version = "1.0.3"
authors = [
    { name = "Tobias van den Bosch", email = "Tobias.van.den.Bosch05@gmail.com" }
]
description = "Simulate Transit Distance After Pedestrianization"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "duckdb-extension-spatial>=1.5.3",
    "osmnx>=2.1.0",
    "pandas>=3.0.3",
    "geopandas>=1.1.3",
    "pyarrow>=24.0.0",
    "pytest>=9.0.3",
    "scipy>=1.17.1",
    "PyQt6>=6.11.0",
    "matplotlib>=3.10.9"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/Tobias0107/STDAP"
Documentation = "https://github.com/Tobias0107/STDAP/tree/main/Documentation"
Issues = "https://github.com/Tobias0107/STDAP/issues"


# Setuptools specific settings

[tool.setuptools.packages.find]
where = ["src"]

